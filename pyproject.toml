[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodkin"
version = "0.1.0"
description = "Thread your proven claims to each job description. Select and re-order, never write."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bodkin = "bodkin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
