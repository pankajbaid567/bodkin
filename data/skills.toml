# Bodkin skill taxonomy. Edit freely; run `python -m bodkin taxonomy` to validate.
#
# Each skill:  id = { name, cat, arch = {archetype = weight 0..1}, aliases = [...], cs = [...], stop = [...] }
#   aliases : matched case-insensitively with token boundaries
#   cs      : matched case-sensitively (for words that are also ordinary English: Go, Spring, React, ...)
#   stop    : phrases that cancel a match that overlaps them ("go to market" is not the Go language)
# Archetypes say what kind of role a skill points to; weights are how strongly.

[meta]
archetypes = ["backend", "distributed", "fintech", "genai", "ml", "data", "infra", "systems", "lowlatency", "security", "fullstack", "mobile", "devtools"]
# Aliases that deliberately belong to two skills ("C/C++" is both C and C++).
shared_aliases = ["c/c++"]

# A role pattern in the first lines of a JD (the title) adds a bonus to its archetype.
[roles]
backend = ["backend engineer", "back-end engineer", "back end engineer", "backend developer", "server-side", "api engineer", "platform engineer", "software development engineer", "sde"]
distributed = ["distributed systems", "storage engineer", "infrastructure engineer", "systems engineer"]
fintech = ["payments", "fintech", "payment engineer", "financial technology"]
genai = ["generative ai", "genai", "llm engineer", "ai engineer", "applied ai", "agent engineer", "ai/ml engineer"]
ml = ["machine learning", "ml engineer", "data scientist", "research engineer", "applied scientist"]
data = ["data engineer", "analytics engineer", "data platform", "big data"]
infra = ["devops", "site reliability", "sre", "cloud engineer", "infrastructure"]
systems = ["embedded", "firmware", "kernel", "systems programmer", "driver", "hardware"]
lowlatency = ["low latency", "low-latency", "quant developer", "quantitative developer", "trading systems", "hft", "quant"]
security = ["security engineer", "application security", "appsec", "product security"]
fullstack = ["full stack", "full-stack", "fullstack", "frontend engineer", "front-end engineer", "web developer"]
mobile = ["android developer", "ios developer", "mobile engineer", "flutter developer", "mobile developer"]
devtools = ["developer tools", "developer productivity", "tooling engineer", "build engineer"]

[cities]
names = ["bengaluru", "bangalore", "hyderabad", "pune", "mumbai", "chennai", "delhi", "gurgaon", "gurugram", "noida", "delhi ncr", "ncr", "kolkata", "ahmedabad", "kochi", "remote", "hybrid", "onsite", "on-site", "work from home"]

